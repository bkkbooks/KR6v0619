body:
  text: 民國七十四年講於台中華雨精舍這部論是大乘廣五蘊論五蘊這個名詞在佛教多得是像阿含經心經等許多地方都看得到小乘佛法以來各部各派對五蘊都有解釋的現在這個地方的五蘊論是唯識法相這一派的大乘佛法的講法當然其中稍稍有一些不同的地方不過大部分都是差不多的這本來是世親菩薩的一部論叫大乘五蘊論但這部論太簡單了一點世親菩薩有個弟子叫安慧就依著世親菩薩這一部大乘五蘊論稍微增加幾句補充幾句有的地方加個解釋使意義更明顯一點大家可以容易瞭解一點這樣子安慧菩薩就造了這一部大乘廣五蘊論上面加個廣字這部論和我們普通的注解不太相同它自己成為一部論與大乘五蘊論本質是一樣的稍微講得詳細一點這是唐朝時候地婆訶羅印度三藏翻譯的第一章五蘊佛説五蘊謂色蘊受蘊想蘊行蘊識蘊五蘊是佛法之中最基本的一個法相佛説五蘊這是總標謂色蘊受蘊想蘊行蘊識蘊五蘊是什麼呢那就是色蘊受蘊想蘊行蘊識蘊這五個第一節色蘊云何色蘊謂四大種及大種所造色色蘊原則上講大體上和我們現在講的物質差不多不過稍稍有一點不同這當中分為兩大類一類叫能造色能造的色就是四大種一類叫所造色就是其他依四大種而所造的色第一項四大種地水火風云何四大種謂地界水界火界風界此復云何謂地堅性水濕性火暖性風輕性界者能持自性所造色故什麼叫做四大種呢就是地界水界火界風界普通叫地水火風四大為什麼叫大呢普遍得很無處不在只要是物質就有它那個地方有物質那個地方就有四大離開四大沒有其他的物質了所以叫大這個界字有一種特性特殊性質的意思而可以做為原因因緣的意義所以像唯識宗裡面這個界字也可以解釋成種子不過這個地方不必解釋為種子因為依地水火風能夠造所造色因此四大叫做界四大種的種不是種類也可説是種類也是有一個因的意思就同我們世界上的種依那個種可以發生什麼東西所以四大也叫做四大種能造換一句話地水火風是物質之中的一種最基本的因素佛教講物質分析到當中最基本的因素也就是叫做地水火風這四類所以這地水火風不是我們看到的地也不是我們喝的水這些是物質當中最微細的一種基本因素一切物質要依它而有的所以叫做四大四界也叫四大種在佛法之中地水火風四種是平等的此復云何佛法所講的四大不是我們平常世界上所講的地水火風那麼為什麼要叫它地水火風呢因為佛法所講的四大還是依我們普通地水火風的意義去引申出來的謂地是堅性水是濕性火是暖性風是輕性從我們世間法來講這個道理也可以講得通比方桌子很堅固東西就放得上去了像水空中東西一放它就掉下來了東西可以放上去是因為桌子有一種堅的特性以我們現在的物質來説就叫固體從普通的固體去瞭解到物質當中的基本因素有一種堅的特性這就是地界堅性的性是特性一種特殊的性質如果沒有這個特性怎麼知道它有呢所以凡是有的有這個法就有它的特性要用它的特性證明有這一種法存在因為物質之中有一種堅性所以我們知道物質最基本因素當中有一種叫做地界那麼下面都可以通了水是濕性表面我們這個世界上的東西叫做液體這流動的液體之中它有一種濕的性質可以把很多東西凝聚起來好像一堆沙土沒有水的話它散開來的拿點水拌一拌的話就會凝聚起來我們看到的水是流動的流動是它的形態它的特性是一種濕的性質樹木花草之類的植物遇到水份就會得到它這種濕的特性的潤濕所以物質之中有一種基本的因素是濕性這就是水界火的性質叫做暖性有溫度有一種熱的性質這在現在科學上的講法叫做能風是輕性會流動的我們普通叫做氣體比方氫氣氦氣空氣氧氣這許多佛法裡的名字就叫做風所以地是固體水就是液體火就是熱能風是一種氣體這個地方就簡單這樣講要是深一層講的話地是堅為性所以能夠擔當任持就是有一種固體的形態出現東西可以撑住了的那叫做地的作用因為水的濕性所以有一種凝聚作用物質就不是一粒一粒各管各的就凝聚了所以水的濕性是凝聚的作用暖性的作用它能夠熟變拿我們人來講我們吃了東西進去會消化中國醫生向來都是叫做一種熱力假使説不太消化中國醫生就説胃寒現在世界上的科學家用火把東西的成分分化溫度一百度它就起了變化一千度一萬度的話到最後連金剛鑽都化了暖性它能夠起一種消化分化的作用風是一種輕動體我們人所以能夠動就是靠這個風我們的血液循環排泄如果沒有風怎麼能夠循環排泄我們的汗毛身體裡面也都是通的假使不通人早就沒有了所以物質的基本因素叫地水火風是從世界上我們眼睛面前看到的地水火風理解推究到頂細頂細的物質到最後有地水火風這四種因素這不是用眼睛能夠看到的因為有地的因素所以物質有堅固性的現象因為有水性才有凝聚現起的現象因為有暖性所以有分化熟變的現象因為有風性所以能夠動沒有風就不能動了這是佛教向來所講的是古代物理學最基本的一種物質因素佛法説這樣的許多事都不是我們眼睛面前的它講到裡面的一種很微細的東西地水火風界者能持自性所造色故自性就是特性能持自性就是它能夠永遠不變的持有這種特性這個持就有一種一直這樣一直這樣的意思堅有堅的特性這個特性它能夠一直保持下來假如這個特性變化了的話那就不能叫地了所造色就是四大界所執持能夠依它而起的色所以界包含了兩種意義一種是能持自性是界意就是它的特性一種是因素的意思所造色其他的色法依它而起第二項四大所造色云何四大所造色謂眼根耳根鼻根舌根身根色聲香味及觸一分無表色等造者因義根者最勝自在義主義增上義是為根義所言主義與誰為主謂即眼根與眼識為主生眼識故如是乃至身根與身識為主生身識故色蘊有兩種四大種四大種所造色四大種講過了云何四大所造色四大所造色的內容普通來講有十一類就是眼耳鼻舌身這五根色聲香味觸這五塵還有無表色等這一類我們普通講色聲香味觸都是所造色其實不是的觸當中有兩分一分是所造色一分是四大因為四大是能造色這個地方是講所造色要把四大拿開所以剩下來的是觸的一分稱為觸一分這個一分是除了四大之外的其他的觸假使講觸的全體四大也是觸一共合起來有十五類無表色等下面講的有無表色三摩地所生色造者因義造是因的意思因有很多的意思所謂因義的長養都是一種增上因就是説要有四大才能夠有所造色沒有四大就沒有所造色所造色要依四大而有其實四大是四大所造色是所造色所以叫做所造是因的意思因四大而有的舉一個例子來説比方一塊布紗就是因這個因與果不同因是因果是果是依紗而有布並不是紗就是布國家也是這樣行政院長發表了通過成立了行政院長下面再推舉某人當外交部長某人做什麼這許多都要依行政院長而産生的依他而有的如果沒有行政院長下面就不可能産生了所造能造的這個造字也就是這樣的一種因不要以為把地水火風配合起來就變成眼根變成耳根了不是的地水火風是四種特殊的因素眼根有眼根的特性耳根有耳根的特性它們是依四大而有的所以四大叫做能造法相不能望文生義望不了的要修的佛法是要學的不像看小説那麼容易根者最勝自在義主義增上義這個根字梵文裡用三個意義來解釋主要的意義在我們認識世界知道各式各樣的一切活動當中根是非常重要的我們平常講身上的是根而外面看到的聽到的聞到的碰到的想到的叫做境還有心理的作用心理活動叫做識我們的認識是依這三個如果我們的眼睛有了一點毛病外面是什麼就看不到青黃赤白也看不出來了那麼眼識也生不起來了整個認識當中我們總覺得心的作用很重要但如果沒有眼耳鼻舌身的話心從那裡去認識世界是什麼全部不曉得了像我們有眼睛的我們能看到東西現在發明了望遠鏡還能看到銀河有的動物沒有眼睛的你説牠能不能知道不要説銀河東西擺在面前牠也不曉得青黃赤白牠也不曉得為什麼牠沒有根根沒有識也不能發生心理活動受限制了所以根在這裡面具有一種重要的地位重要的意義這叫最勝自在最殊勝的自在的主義這個主是為主的意思在我們的認識當中起主要作用增上義增上的給它一種力量有一種強有力的力量能夠影響其他的叫增上所言主義與誰為主謂即眼根與眼識為主生眼識故如是乃至身根與身識為主生身識故為什麼根是主的意思呢比方眼根先有眼根能夠生出眼識眼根就是給眼識為主有身根故能夠生身識所以叫做主比方識要怎麼樣才能夠生起來根境和合生識裡面要有根外面要有境界兩個和合生起識來了那為什麼叫眼識不叫色識呢為什麼叫耳識不叫聲識呢為什麼依根得名不從境得名呢因為根有特殊的力量境一直都是這樣在那裡我們很容易能夠緣取到的換一句話外面的境很普遍很容易得到這個緣而根這個緣特別重要在我們人的身心活動當中根特別重要所以佛法之中都是依根為名的叫做眼識耳識鼻識舌識身識意識照道理講緣取到色聲香味觸法那就叫色識聲識香識其實也沒有什麼不可以可是我們平常都不這樣講就是因為這個根有特殊的主要作用特別是眼耳鼻舌身對於物質世界的瞭解上有特殊作用缺少那一個這一部分就全部不能瞭解我們人樣樣都有有許多牛羊馬也都有但是魚或者田裡的螺螄小生命就不見得眼耳鼻舌身都有的有的在地下過活的衆生牠沒得眼根的牠不生眼根就沒有眼識也有沒得耳朵的很多昆蟲就是靠觸覺的不一定有眼耳鼻舌我們人眼耳鼻舌身最發達所以人最聰明知識最高根非常的重要所以叫最勝自在主增上佛法中的根字約這個意義講講法相每個名字有它的定義雖然不一定這樣講但是凡是論的話它都是確定定義一看就知道是那一派的定義那麼究竟那一個講得比較好你自己去抉擇了假使籠里籠統地圓融無礙這在論書是沒有的籠里籠統那講的什麼呢什麼都不能講論的方法就是科學化的方法甲五根云何眼根謂以色為境淨色為性謂於眼中一分淨色如淨醍醐此性有故眼識得生無即不生什麼叫做眼根呢眼根的境界叫做色這個色和五蘊裡色蘊的色不同色蘊的色等於物質差不多眼根以色為境的色是青黃赤白這一類眼睛看得到的東西眼根的性質就是清淨的色有一種清淨的物質佛法講眼根不是普通我們世俗法講的眼睛講耳根不是一般説的耳朵是講在我們這個普通眼睛當中的一分清淨的色一種清淨的物質如淨醍醐比喻好像醍醐一樣醍醐這東西在我們這裡其實是一種油質在佛經裡講印度人用牛奶提煉叫做酪叫做生酥叫做熟酥熟酥再煉就煉成醍醐熟酥就已經變成浮在水面上的油了而最乾淨最乾淨裡面一點點雜質都沒有的油質是第一營養的營養品叫淨醍醐所以清淨色用清淨醍醐來作譬喻就是這個意思清淨的醍醐形容我們眼睛當中有一分清淨的