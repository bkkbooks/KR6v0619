以幾無漏謂後三少分幾個是無漏呢就是十八界中意界意識界法界這三種界中有一部分是無漏的比方意識我們的意識是有漏的但是聖者他可以起無漏的意識所以聖者可以分別一切法不要誤聽無分別無分別是一種不正確的分別甚至佛也還會分別一切法像佛的一切種智一切法無所不知的當然後來大乘法不是這樣講而現在我們講的這許多阿毗達磨都是從阿含戒律來的法界裡面無為法都是無漏的在法界的心所法裡面善心所法及遍行別境裡面的一部分都可以歸成無漏法煩惱隨眠這許多則都是有漏的真正分別有漏無漏是這樣子來分別的第五項繫不繫幾欲界繫謂一切幾色界繫謂十四除香味及鼻舌識幾無色界繫謂後三幾不繫謂即彼無漏這個地方是四門分別欲界繫色界繫無色界繫不繫分做四門繫就是繫縛沒有得到解脫以前叫做繫等於縛住了的意思一樣叫繫縛三界就是三界生死三界是生死法生死在三界之中所以三界都是繫凡是三界之內的欲界繫色界繫無色界繫都是有漏法所以這個地方講繫和不繫以三界及十八界來分配欲界繫有幾界呢謂一切十八界換一句話欲界裡面有漏的十八界都有的色界所繫的呢只有十四界沒有香味也就是沒有鼻識和舌識到了色界以上初禪二禪三禪四禪生在這一種色界禪禪定境界之中的沒有鼻識舌識鼻識所聞到的是香氣舌識所嘗到的是味沒有鼻識界舌識界也就沒有香界沒有味界可是鼻子舌頭是有的色界天有莊嚴的相鼻子是有的只是它不發展不像我們這個欲界一樣起這許多煩惱所以如果色界天要借識起這一個作用的話他要起欲界識才能夠聞到欲界的香氣才能夠嘗到欲界的滋味所以香界味界鼻識界舌識界這四種界都是欲界的境界色界是沒有的到了無色界只剩三個界了無色界就是沒有色了眼耳鼻舌身色聲香味觸都沒有了那麼眼識耳識鼻識舌識身識當然也就沒有了沒有前五根與前五種境界當然相應的五識就沒有了所以無色界只剩意界意識界法界這後三界用三界繫來配十八界欲界有十八界色界只有十四界無色界只有三界那麼不繫就是無漏法比方涅槃涅槃是超出三界不屬於三界它是無漏法其實無漏的戒定慧這些無漏法都是不繫所以佛法這個道理講起來非常可以加以分別的比方我們現在是人住在欲界那麼我們平常的時候就有這十八界的法假使生在欲界修行證道了不要講大菩薩證初果這一個時候的智慧就是無漏法門不屬三界出三界了這個智慧所證到的四諦真理之類或者大乘法講證到真如無我之類的都是不屬三界生死的所以解脫並不是一定要離開我們這個世界才去解脫在這個世界中只要無漏智慧起來的時候這種境界都已是不屬於三界生死在定中證了初果的聖者證悟了以後不能老是這個樣子他要出定的一出定以後這個世間的法又生起來了眼識就有所看見耳識有所聽到還是有漏法還是屬於三界生死所以聖人生病的時候還是會生病大小便還是要大小便苦惱的時候也有苦惱冷起來也會怕冷聖人也是一樣這就叫繫不繫分別分四類第六項蘊所攝取蘊所攝幾蘊所攝謂除無為幾取蘊所攝謂有漏這個叫蘊取蘊分別蘊和取蘊這兩個名字有分別的除了無為其他的一切有為法都屬五蘊五取蘊古代有的翻譯五取陰純粹是有漏法取是一種煩惱像我們生死衆生的這個五蘊身就是叫五取蘊因為前生愛緣取取緣有有緣生我們這個生死身的五蘊法從取所生從取來的所以叫取蘊五取蘊不但是從取來的還會再生起取煩惱生後面的五取蘊同時我們現在就很多時候與取相應取的煩惱時常生起所以有漏的生死法叫做取蘊比方佛阿羅漢甚至於證悟了的聖人他們的五蘊還是五蘊眼耳鼻舌身這許多色聲香味觸之類的還是有漏法但是他們已不叫五取蘊叫五蘊因為已經得到解脫了聖人的五蘊之所以還是叫做五蘊因為還是從取所生的不過不會再生起取來就是了所以取蘊就是有漏法蘊可能是有漏也可能無漏不限的第七項善不善無記幾善幾不善幾無記謂十通三性七心界色聲及法界一分八無記性十八界裡面有幾種是善的幾種是不善的幾種是無記的先簡單解説一下善不善無記一種心理的作用也好活動也好我們的行為也好這樣子做了對己對人有利將來能夠感到好的果報的這個叫做善假使這種心這種行為對自對他都沒有利益或者是傷害別人將來主要是未來生中要受苦果的這個叫惡業不善業另外有一種叫無記也不能説是善的也不能説是不善的比方這手或者頭動一下無所謂善不善這個就叫無記知道了善不善無記的定義那麼就可以分別了十通三性有十個界通於善惡無記的那幾個呢七心界色聲及法界一分七心界就是意界和前面的六識界眼識耳識鼻識舌識身識意識這可以是善也可以是不善也可以是無記色聲色聲怎麼能夠説是善和不善呢比方我用我的聲音説幾句好話因為這個聲音説的是好話就是善的善的語業假使罵人挑撥離間這幾句話講了這個聲音就是不善的比方殺盜淫都要用身體去做的這一種當然是壞的是不善手裡拿東西去布施給人看到一個人跌倒了把他扶起來這樣的行動就是善身業屬於色法語業屬於聲法這兩種是表示我們內心的一種意義所以色界和聲界就是身業和語業通於善惡如果只是發出阿阿的聲音頭動一動仰一仰這個聲界和色界就是無記無所謂善惡這是簡單地講其實我們的眼根耳根鼻根舌根身根都是前生業報所感到的現在都是無記法叫做無覆無記前生業報所感的都是無記去殺動手罵這不是前生業報是現在做的這才有善有惡那麼香味觸這裡面是沒有善惡的法界一分通三性比方我們講念失念這是屬於煩惱的假使是説信進念定慧這是無漏的是善法假使普普通通的記著像讀書一樣的這樣過去的這種念那是無記法界裡面很多是通於三性的其他八個都是無記性眼耳鼻舌身這五界是無記的業報所感的還有香味觸這三界沒有善惡這八種都是無記法沒有善惡的第八項內外幾是內謂十二除色聲香味觸及法界幾是外謂所餘六六根這屬於內衆生之所以為衆生衆生的生命自體就是眼耳鼻舌身意六界這六界當然是屬於內還有眼識耳識鼻識舌識身識意識這六種識是心理活動心理作用當然屬於內其他的色聲香味觸及法界都是以六識所緣的境界所以這個就是外換一句話外就是色聲香味觸及法界除了這六個外以外剩下的十二個就屬於內第九項有緣慮無緣慮幾有緣謂七心界及法界少分心所法性幾無緣謂餘十及法界少分這個有緣無緣的緣與我們普通講的我和你有緣兩個人很有緣的緣不同這個緣是緣慮的緣單單一個緣字容易誤解加個慮字緣慮心能夠去了別境界能夠去緣慮境界的叫做有緣不能夠去緣境界的就叫做無緣七心界這個當然是有緣慮的是能緣法法界當中的少分就是心相應法所以是心所法性叫法界少分是法界當中的一部分就是屬於心所法的這一部分遍行別境善煩惱不定這許多這都是有緣慮的法其他的都是沒有緣慮的眼耳鼻舌身這五根色聲香味觸這五塵法界當中的一部分像無為法不相應行這種都是沒有緣慮的佛法裡面這些地方分得很細比方我們眼睛看到的東西我們總説我眼睛能夠看到好像我眼睛能夠知道一樣佛法裡講的不是這樣眼睛是取這個境界好像照相機一樣啪照出相來取這個境界能知道的那是眼識不是眼根眼根只會取境界不會緣境界比方眼根好像照相機啪一下照下來照出相片來人再看看這是什麼就知道了這裡面還有認識我們眼睛裡面的瞳仁一看就把外面的影像照到裡面去這就是它取到這個境界拿現在的話講這是一種生理作用等到知道是什麼那是一種心理的活動心理作用是與眼識相應的心所法我們平常講我眼睛看到耳朵聽到好像眼睛耳朵就會知道其實眼睛耳朵鼻子不會的什麼道理呢因為如果心注意到另一邊的事情上即便眼睛睜得大大的眼睛是看了這個但是不會知道因為心不在心注意到另一邊去了可見眼睛不會知道的眼睛只會取這個相眼識才會知道所以這叫有緣其他十個眼耳鼻舌身色聲香味觸及法界的少分那就是無緣法第十項有分別無分別幾有分別謂意識界意界及法界少分這裡説只有意識界意界及法界少分這三種是有分別的沒有説到無分別換一句話其他的十五界及法界少分就是沒有分別了佛法的名字有許多講起來很難講比方這裡説到有分別眼識有沒有分別呢其實眼識也有分別的但是這一個分別的名字叫自性分別它是直覺的就知道耳朵聽到的話因耳根引起耳識它是一種直覺的知道這一種叫自性分別但是真正的説要去研究研究要去瞭解瞭解那這一種的分別眼識耳識鼻識舌識身識都沒有的我們普通講分別是分別這是這樣那是那樣是指對事理種種方面的分別這一類換一句話這是什麼人我要認識這個人的話那眼識是不成的沒有這個作用它雖然看到這個人是個什麼樣子但是要知道這是什麼人那不是它的事是意識的事了所以意識才是有分別的我們一天到晚的分別主要都是意識意識裡面還有意界末那識執我的就是這意界法界當中的心所法如果與五識相應那麼這個心所法也沒有分別也是自性分別如果是與意識相應不管是善的是惡的只要是與意識相應那這種心所法也是有分別所以這裡説的有沒有分別也不是説五識什麼都不曉得它知道只是它這是叫做自性分別它沒有我們普通説的這個分別的作用第十一項有執受非執受幾有執受謂五內界及四界少分謂色香味觸幾非執受謂餘九及四少分比方我們這個人不管是説物質的也好心心所法也好其實是各式各樣和合而有的人之所以能成為一個有機的人能夠統一活動成為像我們的身心之類的是阿賴耶識所執受的所以簡單説屬於我們衆生的就是有執受的比方桌子山河大地草木叢林土泥這許多就是非執受所以有執受就是屬於衆生法謂五內界眼耳鼻舌身還有四界的少分色香味觸這都為心心所法所執受的屬於有執受我們這個人有眼耳鼻舌身這個沒有問題我自己看到我的手手是色我這個身根去觸不一定觸別的我的手自己碰自己也是身根觸也有觸不但我吃東西的時候是有滋味的沒有吃東西的時候其實裡面還是有味的我們人身體上也有一種氣息一種氣味這是香這種都是有執受的這裡面有個聲音是非執受的比方外面的聲音風吹草動的聲音或者是水流的聲音這是非執受的那麼我們講話的聲音怎麼也是非執受呢執受的就是在我們身上的講話的聲音是進進出出的氣的活動聲音不能説是在我們身上的這是氣息在那裡進出所以聲音是非執受而且凡是執受的東西它很穩定的聲音不穩定不發就不發的沒有聲音就根本沒有聲音但是色香味觸一直都在那裡的所以有執受法就是這五內界及色香味觸四界少分其他的都是非執受法至於心心所法是能夠執受的所以也不在其內也是非執受第十二項同分彼同分幾同分謂五內有色界與彼自識等境界故幾彼同分謂彼自識空時與自類等故最後一個很特殊上面講到衆同分現在這個地方不是衆同分叫同分彼同分這個同分就是同類的意思五內有色界就是眼耳鼻舌身這五根比方眼根去取色境界眼識就起來瞭解這個色境界這個眼識就是眼根的自識眼根取色正在起眼識眼根去看這個色眼識去分別這個色根與彼自識等境界故眼耳鼻舌身這五根在生起自識的時候因為和自識的境界是同一個境界所以叫同分彼同分佛法裡這個名字很特別的謂彼自識空時與自類等故比方眼睛看眼識再瞭解這個時候叫同分眼睛不看了這時候眼識也不起了就是只有眼根眼根自類相等與眼識沒有同境界的意義這叫彼同分換一句話有一點像非同分雖然不是上面的同分它沒有與彼同沒有與其他的相等可是它還是自己同還是有同分這叫彼同分這許多名詞名相我們這麼簡要講講有很多也不太好懂真正的研究要慢慢慢慢去理解參考很多注解慢慢地懂起來佛説的經很多佛説的道理也很多也很困難不容易瞭解後來的佛弟子就把佛説過的五蘊十二處十八界這許多名詞收集起來慢慢慢慢歸類得出這麼一個一種有多少佛説的就是這許多的歸類各式各樣的説法説來説去主要的就是這些問題都是依這些事情講的不管講善惡講起煩惱繫縛講生死解脫講來講去都是講這些問題所以把這些基本名詞知道了以後其他的佛法慢慢慢慢瞭解這種基本的我叫做基礎佛學要瞭解佛法這是一種基礎我們中國人有的人歡喜講得很高妙一下子講心講性講有講空頭頭是道可是實際上這種基礎佛學沒有很空洞的經不起問的講得好像有道理真正一個問題一研究的話就答不出來了阿毗達磨對每一個問題都依據這個根本講的比方説業報感業業是什麼它是什麼情形的業報是怎麼感的所講的種種都是依據這個根本講的這個看似很淺可是真正對於我們生死輪回涅槃解脫修行裡面許多的問題講得很具體所以現在做一個中國佛教徒的話當然高妙的也要學一點但是如果沒有這種基礎的話那就叫空談心性了專門講上乘的高的道理下面沒有基礎不成所以我並不是講什麼高妙得很的我們從前都還是從基礎的學來的雖然我不太講這許多事情妙雲集裡也都沒有向來不講這許多的但是沒有這許多的基本知識其實是不成的當然有許多問題各部各派講的解説的有一點不同的地方也有的但是本論所講的是主要的編按大乘廣五蘊論講記紙本之出版係根據華雨精舍明聖法師提供的原音録音帶經聽録整理編輯而成印公導師於民國年月日起至月日止每日上午兩個小時左右在改建前的太平鄉華雨精舍舊宅內宣講聽衆有比丘淨耀比丘尼明聖慧琛心如性斌常妙德歆清硯如誠如儉達聞並夏居士朱秀英等謹敘講記因緣如上以徵時地人之信也
